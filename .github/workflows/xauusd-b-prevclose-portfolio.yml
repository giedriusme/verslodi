name: XAUUSD B plus prevclose portfolio
on:
  push:
    branches: [xauusd-backtest-20260924]
    paths:
      - 'xauusd_b_prevclose_portfolio.py'
      - '.github/workflows/xauusd-b-prevclose-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Patch pandas mod-column access
        run: sed -i 's/g\.mod/g["mod"]/g' xauusd_portfolio_discovery.py
      - name: Run portfolio test
        run: python xauusd_b_prevclose_portfolio.py
      - name: Commit results
        run: |
          git checkout -- xauusd_portfolio_discovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b_prevclose_portfolio_results
          git commit -m "Add B plus previous-close portfolio results" || exit 0
          git pull --rebase origin xauusd-backtest-20260924
          git push origin HEAD:xauusd-backtest-20260924
