name: XAUUSD backtest

on:
  push:
    branches:
      - xauusd-backtest-20260924
    paths:
      - xauusd_intraday_oos.py
      - .github/workflows/xauusd-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests scikit-learn
      - name: Run pooled intraday OOS search
        run: python xauusd_intraday_oos.py
      - name: Commit results
        run: |
          git config user.name "xauusd-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add intraday_oos_results
          if ! git diff --cached --quiet; then
            git commit -m "Add pooled intraday XAUUSD OOS results"
            git push
          fi
