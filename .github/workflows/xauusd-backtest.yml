name: XAUUSD backtest

on:
  push:
    branches:
      - xauusd-backtest-20260924
    paths:
      - xauusd_backtest.py
      - xauusd_rr_search.py
      - .github/workflows/xauusd-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Run high win-rate RR strategy search
        run: python xauusd_rr_search.py

      - name: Commit results to analysis branch
        run: |
          git config user.name "xauusd-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rr_search_results
          if ! git diff --cached --quiet; then
            git commit -m "Add high win-rate RR XAUUSD strategy results"
            git push
          fi
