name: XAUUSD backtest

on:
  push:
    branches:
      - xauusd-backtest-20260924
    paths:
      - xauusd_outbox_frontier.py
      - .github/workflows/xauusd-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Analyze outbox frontier
        run: python xauusd_outbox_frontier.py
      - name: Commit frontier results
        run: |
          git config user.name "xauusd-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outbox_frontier_results
          if ! git diff --cached --quiet; then
            git commit -m "Add outbox strategy frontier results"
            git push
          fi
