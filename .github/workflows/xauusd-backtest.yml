name: XAUUSD backtest

on:
  push:
    branches:
      - xauusd-backtest-20260924
    paths:
      - xauusd_ml_postfilter.py
      - .github/workflows/xauusd-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Filter OOS model results
        run: python xauusd_ml_postfilter.py
      - name: Commit filtered results
        run: |
          git config user.name "xauusd-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ml_oos_postfilter
          if ! git diff --cached --quiet; then
            git commit -m "Add filtered XAUUSD ML OOS results"
            git push
          fi
