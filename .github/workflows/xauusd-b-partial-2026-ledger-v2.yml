name: XAUUSD B Partial 2026 ledger v2
on:
  push:
    branches: [xauusd-backtest-20260924]
    paths:
      - 'xauusd_b_partial_2026_ledger_v2.py'
      - '.github/workflows/xauusd-b-partial-2026-ledger-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Patch pandas mod-column access
        run: sed -i 's/g\.mod/g["mod"]/g' xauusd_portfolio_discovery.py
      - name: Run ledger
        run: python xauusd_b_partial_2026_ledger_v2.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b_partial_2026_ledger_v2
          git commit -m "Add B Partial 2026 compounding ledger" || exit 0
          git pull --rebase origin xauusd-backtest-20260924
          git push origin HEAD:xauusd-backtest-20260924
