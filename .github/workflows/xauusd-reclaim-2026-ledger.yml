name: XAUUSD reclaim 2026 ledger
on:
  push:
    branches: [xauusd-backtest-20260924]
    paths:
      - 'xauusd_reclaim_2026_ledger.py'
      - '.github/workflows/xauusd-reclaim-2026-ledger.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Patch pandas mod-column access
        run: sed -i 's/g\.mod/g["mod"]/g' xauusd_portfolio_discovery.py
      - name: Run ledger
        run: python xauusd_reclaim_2026_ledger.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reclaim_2026_ledger
          git commit -m "Add fixed reclaim 2026 ledger results" || exit 0
          git push origin HEAD:xauusd-backtest-20260924
