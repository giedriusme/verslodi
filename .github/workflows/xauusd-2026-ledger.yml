name: XAUUSD 2026 ledger

on:
  push:
    branches:
      - xauusd-backtest-20260924
    paths:
      - xauusd_2026_trade_ledger.py
      - .github/workflows/xauusd-2026-ledger.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Build 2026 trade ledger
        run: python xauusd_2026_trade_ledger.py
      - name: Commit ledger results
        run: |
          git config user.name "xauusd-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trade_ledger_2026
          if ! git diff --cached --quiet; then
            git commit -m "Add 2026 XAUUSD strategy trade ledger results"
            git push
          fi
