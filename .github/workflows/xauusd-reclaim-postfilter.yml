name: XAUUSD reclaim postfilter
on:
  push:
    branches: [xauusd-backtest-20260924]
    paths:
      - 'xauusd_reclaim_postfilter.py'
      - '.github/workflows/xauusd-reclaim-postfilter.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python xauusd_reclaim_postfilter.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b_reentry_reclaim_results
          git commit -m "Add reclaim postfilter results" || exit 0
          git push origin HEAD:xauusd-backtest-20260924
