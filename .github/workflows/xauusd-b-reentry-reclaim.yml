name: XAUUSD B re-entry reclaim
on:
  push:
    branches: [xauusd-backtest-20260924]
    paths:
      - 'xauusd_b_reentry_reclaim.py'
      - '.github/workflows/xauusd-b-reentry-reclaim.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scikit-learn
      - name: Run reclaim search
        run: python xauusd_b_reentry_reclaim.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b_reentry_reclaim_results
          if ! git diff --cached --quiet; then
            git commit -m "Add XAUUSD retest reclaim results"
            git push
          fi
