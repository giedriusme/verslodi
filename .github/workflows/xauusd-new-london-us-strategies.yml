name: XAUUSD new London US strategies
on:
  push:
    branches: [xauusd-backtest-20260924]
    paths:
      - 'xauusd_new_london_us_strategies.py'
      - '.github/workflows/xauusd-new-london-us-strategies.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Patch pandas mod-column access
        run: sed -i 's/g\.mod/g["mod"]/g' xauusd_portfolio_discovery.py
      - name: Run research
        run: python xauusd_new_london_us_strategies.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new_london_us_results
          git commit -m "Add London and US open strategy results" || exit 0
          git pull --rebase origin xauusd-backtest-20260924 || true
          git push origin HEAD:xauusd-backtest-20260924
