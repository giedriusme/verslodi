name: XAUUSD three-strategy TP SL sweep
on:
  push:
    branches: [xauusd-backtest-20260924]
    paths:
      - 'xauusd_three_strategy_tp_sl_sweep.py'
      - '.github/workflows/xauusd-three-strategy-sweep.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xauusd-backtest-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Patch pandas mod-column access
        run: sed -i 's/g\.mod/g["mod"]/g' xauusd_portfolio_discovery.py
      - name: Run sweep
        run: python xauusd_three_strategy_tp_sl_sweep.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add three_strategy_tp_sl_sweep_results
          git commit -m "Add XAUUSD three-strategy TP SL sweep results" || exit 0
          git push origin HEAD:xauusd-backtest-20260924
